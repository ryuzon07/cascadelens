# Parameter grids from section 9.1 of the project documentation. Each entry is a cartesian product.
# Anything left out takes the default in its parameter schema under src/cascadelens/perturb/.
seed: 0
perturbations:
  - id: P1
    name: random_metric_loss
    realism: simulated
    params:
      rate: [0.1, 0.2, 0.3, 0.5]
      level: [series, sample]
  - id: P2
    name: failure_correlated_loss
    realism: simulated
    params:
      rate: [0.1, 0.2, 0.3, 0.5]
      near_boost: [3.0]
      after_boost: [3.0]
  - id: P3
    name: whole_modality_loss
    realism: simulated
    params:
      family: [error, latency, cpu, memory, disk, network, traffic]
  - id: P4
    name: window_shift
    realism: simulated
    params:
      offset_seconds: [-120, -60, -30, 30, 60, 120]
  - id: P5
    name: window_noise
    realism: simulated
    params:
      max_jitter_seconds: [30, 60]
  - id: P6
    name: edge_deletion
    realism: simulated
    params:
      rate: [0.1, 0.2, 0.3]
  - id: P7
    name: edge_addition
    realism: simulated
    params:
      rate: [0.1, 0.2]
  - id: P8
    name: inferred_topology
    realism: simulated
    params:
      method: [correlation, lagged]
  - id: P9
    name: unseen_fault_type
    realism: held-out
    params:
      split: [lofo]
  - id: P10
    name: unseen_system
    realism: held-out
    params:
      split: [loso]
  - id: P11
    name: sampling_rate_degradation
    realism: simulated
    params:
      factor: [2, 5]
  - id: P12
    name: delayed_series
    realism: simulated
    params:
      max_offset_seconds: [15]
      late_fraction: [0.1]
  - id: P13
    name: metric_renaming_unit_drift
    realism: simulated
    params:
      mode: [rename, rescale]
      service_fraction: [0.3]
